[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lulc-fetch"
version = "0.0.3b0"
description = "Fetch Sentinel-2 imagery, LULC reference maps and high-res imagery for an AOI"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy",
    "rasterio>=1.3",
    "pystac-client>=0.7",
    "planetary-computer",
    "requests",
    "shapely>=2",
    "pyshp>=2.3",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn[standard]", "python-multipart", "keyring", "anthropic", "scikit-learn", "pyarrow", "joblib", "xgboost", "lightgbm", "openpyxl", "pandas"]
# deep-learning tools (optional; the app can also install these itself)
dl = ["torch", "torchvision", "segmentation-models-pytorch"]
yolo = ["torch", "torchvision", "ultralytics"]   # AGPL-3.0: optional, never bundled
# the test suite (tests/): pip install -e ".[web,test]"
test = ["pytest", "httpx"]

[project.scripts]
lulc-fetch = "lulc_fetch.cli:main"
lulc-fetch-web = "webapp.server:main"
lulc-fetch-app = "webapp.desktop:main"

[tool.setuptools]
packages = ["lulc_fetch", "lulc_fetch.agri", "lulc_fetch.embeddings", "lulc_fetch.lightseg", "lulc_fetch.hydro", "webapp", "webapp.routes"]

[tool.setuptools.package-data]
webapp = ["static/*", "static/tools/*/*", "static/app/*", "static/app/*/*", "static/app/*/*/*", "static/field/*"]
"lulc_fetch.agri" = ["data/*.json", "data/kb/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning",
]
