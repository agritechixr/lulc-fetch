# Builds the LULC Fetch desktop apps (macOS Apple Silicon, Windows) and, for version tags (v1.2.3),
# publishes them on a GitHub Release.   Manual run: Actions ▸ Build desktop apps ▸ Run workflow.
name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which apps to build"
        type: choice
        options: [all, windows, macos]
        default: all
      release_tag:
        description: "Also add the apps to this existing release (e.g. v0.1.0); empty = don't"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest macOS version a build runs on is the build machine's version (set in the app)
          - { os: macos-14, name: macOS-AppleSilicon, family: macos, sub: macos-arm, min_macos: "14.0" }
          - { os: windows-latest, name: Windows, family: windows, sub: windows, min_macos: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip?
        id: skip
        shell: bash
        run: |
          want="${{ github.event.inputs.platforms || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.family }}" ] || [ "$want" = "${{ matrix.sub }}" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; else echo "run=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.skip.outputs.run == 'yes'
      - uses: actions/setup-python@v5
        if: steps.skip.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - name: OpenMP runtime (needed by XGBoost / LightGBM on macOS)
        if: steps.skip.outputs.run == 'yes' && runner.os == 'macOS'
        run: brew install libomp
      - name: Install dependencies
        if: steps.skip.outputs.run == 'yes'
        run: |
          python -m pip install --upgrade pip
          # prefer ready-made packages: never compile GDAL / rasterio etc. from source
          pip install --prefer-binary -e ".[web]" pyinstaller
      - name: Build (macOS)
        if: steps.skip.outputs.run == 'yes' && runner.os == 'macOS'
        env:
          LULC_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          LULC_MIN_MACOS: ${{ matrix.min_macos }}
        run: |
          ./packaging/build_mac.sh
          mv dist/LULC-Fetch.dmg "dist/LULC-Fetch-${{ matrix.name }}.dmg"
      - name: Build (Windows)
        if: steps.skip.outputs.run == 'yes' && runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Smoke test (start the built app and use it)
        if: steps.skip.outputs.run == 'yes'
        run: python packaging/smoke_test.py
      - uses: actions/upload-artifact@v4
        if: steps.skip.outputs.run == 'yes'
        with:
          name: LULC-Fetch-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && (github.ref_type == 'tag' || github.event.inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.ref_type == 'tag' && format('LULC Fetch {0}', github.ref_name) || '' }}
          make_latest: true
          files: artifacts/*
          fail_on_unmatched_files: false
          body: |
            ## Download

            | Computer | File |
            |---|---|
            | Mac with Apple Silicon (M1–M4), macOS 14 or newer | `LULC-Fetch-macOS-AppleSilicon.dmg` |
            | Windows 10 / 11 (64-bit) | `LULC-Fetch-Windows.zip` |

            No Python or other software needed. See the README for first-start steps (the app isn't signed yet,
            so macOS / Windows ask once before opening it).
