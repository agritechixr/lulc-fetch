# Publishes the product website (the site/ folder) on GitHub Pages: https://agritechixr.github.io/lulc-fetch/
# plus the phone page for field collection (webapp/static/field/ → /field/: phones give a page GPS only over https).
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "webapp/static/field/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: cp -r webapp/static/field site/field
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
